# dsh-r-runner bundle patch — inserts one dual-face plugin row into the profile
# roster. The node half (exports ".") owns the host-side R spawn + /r/api/*
# routes; the dsh.client declaration in package.json loads the browser half
# (exports "./client") into the web GUI's right sidebar.
- insert:
    - id: ui-r-runner
      name: dsh-r-runner
